server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;

    # Cross-origin isolation. COOP+COEP make the page crossOriginIsolated, which
    # exposes SharedArrayBuffer → the embedding ORT WASM backend runs
    # multi-threaded on devices without real WebGPU (it is otherwise pinned to a
    # single thread). credentialless (not require-corp) lets cross-origin no-cors
    # subresources — the VAD CDN assets, Google Fonts — keep loading without
    # forcing CORP on every origin. Matches the dev choice in vite.config.ts.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # SPA fallback — client-side routes resolve to index.html. Real files
    # (/model/*, hashed /assets/*) are served directly; only misses fall back.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so a new deploy is picked up on the next load.
    # nginx add_header does not inherit into a location with its own add_header,
    # so the isolation headers are repeated in every location that sets any.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # OAuth client identity (CIMD). The document is generated from the request's
    # own Host so self-hosters configure nothing. $http_host (not $host) is used
    # because it keeps a non-default port, and client_id must equal the fetched
    # URL exactly. Behind Traefik the Host header is forwarded unchanged, so it
    # carries the public port when there is one (and none for 443). This file is
    # a server-level include, where `map` is illegal, so the value is validated
    # with `if` + `return`, which is safe in a location. The value lands inside a
    # JSON string, hence the strict allow-list: anything else gets 400.
    location = /oauth/client-metadata.json {
        if ($http_host !~ "^[A-Za-z0-9.-]+(:[0-9]+)?$") {
            return 400;
        }
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        # The body depends on Host, so a shared cache must not mix hosts.
        add_header Vary "Host";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        return 200 '{"client_id": "https://${http_host}/oauth/client-metadata.json", "client_name": "Chatsundere", "client_uri": "https://${http_host}", "redirect_uris": ["https://${http_host}/oauth/callback"], "grant_types": ["authorization_code", "refresh_token"], "response_types": ["code"], "token_endpoint_auth_method": "none"}';
    }

    # OAuth redirect target: a standalone static page (not the SPA, whose shell
    # loads Google Fonts). The query holds a one-time code, so it is never
    # logged here and never leaks through Referer.
    location = /oauth/callback {
        access_log off;
        try_files /oauth-callback.html =404;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Admin console SPA, baked in same-origin so it shares the user-client's
    # IndexedDB. Its own client-side routes fall back to the admin index.
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Never cache the admin shell, same reasoning as /index.html — otherwise a
    # heuristically cached shell can reference asset hashes a later deploy
    # overwrote, breaking admin with stale-asset 404s.
    location = /admin/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Hashed admin build output — safe to cache forever, mirrors /assets/.
    location /admin/assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Hashed Vite output — safe to cache forever. Worker chunks live here and
    # must carry the isolation headers or Chromium refuses to embed them in the
    # cross-origin-isolated document.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Self-hosted embedding weights (config/tokenizer JSON + the .onnx graphs).
    # Content-addressed by the pinned model revision → cache aggressively.
    location /model/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;
}

name: chatsundere-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatsundere
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: auth_db
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'chatsundere', '-d', 'auth_db']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chatsundere-dev

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chatsundere-dev

  minio:
    # S3-compatible object store backing the blob transport (blob spec §14).
    # Pinned to the newest published community image (MinIO stopped publishing
    # container images in October 2025; later fixes, incl. the CVE-2025-62506
    # session-policy fix in RELEASE.2025-10-15T17-29-55Z, are source-only —
    # see DEPLOYMENT.md ch. 7). Dev-only, secret-free lab credentials.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: chatsundere-dev
      MINIO_ROOT_PASSWORD: chatsundere-dev-secret
    ports:
      # API only, bound to loopback for local dev; the web console (9001) is
      # deliberately NOT published (blob spec §17 ch.10).
      - '127.0.0.1:9000:9000'
    volumes:
      - ./data/minio:/data
    healthcheck:
      # /minio/health/live is the documented liveness endpoint. If a future
      # image drops curl, switch to ['CMD', 'mc', 'ready', 'local'].
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chatsundere-dev

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - '9090:9090'
    volumes:
      # Named volume rather than a bind-mount because the prometheus image
      # runs as `nobody` (UID 65534) without an entrypoint chown, so a
      # host-created bind-mount target ends up root-owned and unwritable.
      # Reset state with: docker volume rm chatsundere-dev_prometheus_data
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # NOT 'host-gateway' — that magic resolves to docker0 (172.17.0.1)
      # on Linux, which is unreachable from our user-defined bridge below.
      # Hard-code the user-defined bridge gateway (172.28.0.1) instead.
      - 'host.docker.internal:172.28.0.1'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9090/-/healthy']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - chatsundere-dev

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '3001:3000'
    volumes:
      # Named volume for the same reason as prometheus — grafana runs as
      # UID 472 and a root-owned bind-mount target leaves it unable to
      # write its sqlite database.
      # Reset state with: docker volume rm chatsundere-dev_grafana_data
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - chatsundere-dev

volumes:
  prometheus_data:
  grafana_data:

networks:
  chatsundere-dev:
    driver: bridge
    ipam:
      config:
        # Pinned so host.docker.internal:172.28.0.1 (above) stays stable
        # across compose down/up cycles. /24 is plenty for four services.
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

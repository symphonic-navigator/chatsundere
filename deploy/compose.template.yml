name: ${INSTANCE_NAME}

services:
  frontend:
    image: ghcr.io/symphonic-navigator/chatsundere-frontend:latest
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${INSTANCE_NAME}-frontend.rule=Host(`${HOST_APP}`)"
      - "traefik.http.routers.${INSTANCE_NAME}-frontend.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME}-frontend.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.${INSTANCE_NAME}-frontend.loadbalancer.server.port=80"
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${INSTANCE_NAME}"
    networks: [chatsundere, traefik]

  auth:
    image: ghcr.io/symphonic-navigator/chatsundere-backend:latest
    restart: unless-stopped
    # Migrate-then-serve: migrations are NOT run at boot by index.ts (verified —
    # a separate db:migrate script); running them in the command makes every
    # deploy/upgrade (incl. a Watchtower image pull) self-migrate idempotently.
    # cd into the service dir so drizzle's `migrationsFolder: './migrations'`
    # and the package script resolve; `exec` hands signals to the Bun process.
    command: ['sh', '-c', 'cd apps/auth-service && bun run db:migrate && exec bun src/index.ts']
    environment:
      NODE_ENV: production
      PORT: '3100'
      LOG_LEVEL: ${LOG_LEVEL}
      API_BASE_URL: ${API_BASE_URL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db
      REDIS_URL: redis://redis:6379/0
      AUTH_JWT_PRIVATE_KEY: ${AUTH_JWT_PRIVATE_KEY}
      OPAQUE_SERVER_SETUP: ${OPAQUE_SERVER_SETUP}
      INVITATION_HMAC_KEY: ${INVITATION_HMAC_KEY}
      REFRESH_TOKEN_HMAC_KEY: ${REFRESH_TOKEN_HMAC_KEY}
      HMAC_KEY_PENDING_CODES: ${HMAC_KEY_PENDING_CODES}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PROXY_PUBLIC_URL: ${PROXY_PUBLIC_URL}
      SYNC_PUBLIC_URL: ${SYNC_PUBLIC_URL}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL}
      SYNC_BLOBS_ENABLED: ${SYNC_BLOBS_ENABLED}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      # Every public auth route lives under /api/v1/*; /metrics, /healthz and
      # /readyz are top-level and must stay off the public router (Prometheus
      # still reaches them over the internal chatsundere network, unaffected).
      - "traefik.http.routers.${INSTANCE_NAME}-auth.rule=Host(`${HOST_AUTH}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${INSTANCE_NAME}-auth.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME}-auth.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.${INSTANCE_NAME}-auth.loadbalancer.server.port=3100"
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${INSTANCE_NAME}"
    networks: [chatsundere, traefik]

  sync:
    image: ghcr.io/symphonic-navigator/chatsundere-backend:latest
    restart: unless-stopped
    # Migrate-then-serve (see auth). sync ALSO needs this: getInstanceEpoch reads
    # sync_meta at boot, a table a migration creates + seeds — without migrating
    # first the service refuses to boot.
    command: ['sh', '-c', 'cd apps/sync-service && bun run db:migrate && exec bun src/index.ts']
    environment:
      NODE_ENV: production
      PORT: '3200'
      OPS_PORT: '9091'
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sync_db
      REDIS_URL: redis://redis:6379/0
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS}
      RATE_LIMIT_USER_PER_MIN: ${RATE_LIMIT_USER_PER_MIN}
      RATE_LIMIT_IP_PER_MIN: ${RATE_LIMIT_IP_PER_MIN}
      RATE_LIMIT_DELETE_PER_MIN: ${RATE_LIMIT_DELETE_PER_MIN}
      MAX_RECORD_BYTES: ${MAX_RECORD_BYTES}
      ACCOUNT_QUOTA_BYTES: ${ACCOUNT_QUOTA_BYTES}
      MAX_PUSH_RECORDS: ${MAX_PUSH_RECORDS}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES}
      MAX_BLOB_BYTES: ${MAX_BLOB_BYTES}
      BLOB_QUOTA_FLOOR_BYTES: ${BLOB_QUOTA_FLOOR_BYTES}
      BLOB_UPLOAD_IDLE_TIMEOUT_S: ${BLOB_UPLOAD_IDLE_TIMEOUT_S}
      PULL_LIMIT_DEFAULT: ${PULL_LIMIT_DEFAULT}
      PULL_LIMIT_MAX: ${PULL_LIMIT_MAX}
      PULL_BYTE_BUDGET: ${PULL_BYTE_BUDGET}
      DOORBELL_TICKET_TTL_S: ${DOORBELL_TICKET_TTL_S}
      WS_PING_INTERVAL_S: ${WS_PING_INTERVAL_S}
      WS_IDLE_TIMEOUT_S: ${WS_IDLE_TIMEOUT_S}
      MAX_SOCKETS_PER_ACCOUNT: ${MAX_SOCKETS_PER_ACCOUNT}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${INSTANCE_NAME}-sync.rule=Host(`${HOST_SYNC}`)"
      - "traefik.http.routers.${INSTANCE_NAME}-sync.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME}-sync.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.${INSTANCE_NAME}-sync.loadbalancer.server.port=3200"
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${INSTANCE_NAME}"
    networks: [chatsundere, traefik]

  proxy:
    image: ghcr.io/symphonic-navigator/chatsundere-backend:latest
    restart: unless-stopped
    command: ['bun', 'apps/proxy-service/src/index.ts']
    environment:
      NODE_ENV: production
      PORT: '8080'
      OPS_PORT: '9090'
      LOG_LEVEL: ${LOG_LEVEL}
      REDIS_URL: redis://redis:6379/2
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS}
      RATE_LIMIT_USER_PER_MIN: ${RATE_LIMIT_USER_PER_MIN}
      RATE_LIMIT_IP_PER_MIN: ${RATE_LIMIT_IP_PER_MIN}
      MAX_BODY_BYTES: ${PROXY_MAX_BODY_BYTES}
      MAX_CONCURRENT_PER_USER: ${MAX_CONCURRENT_PER_USER}
      PROXY_IDLE_TIMEOUT_S: ${PROXY_IDLE_TIMEOUT_S}
    depends_on:
      redis: {condition: service_healthy}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${INSTANCE_NAME}-proxy.rule=Host(`${HOST_PROXY}`)"
      - "traefik.http.routers.${INSTANCE_NAME}-proxy.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME}-proxy.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.${INSTANCE_NAME}-proxy.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${INSTANCE_NAME}"
    networks: [chatsundere, traefik]

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER}', '-d', 'auth_db']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [chatsundere]

  redis:
    image: redis:7-alpine
    restart: always
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [chatsundere]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [chatsundere]

  # >>> MONITORING
  prometheus:
    image: prom/prometheus:latest
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${INSTANCE_NAME}-prometheus.rule=Host(`${HOST_PROMETHEUS}`)"
      - "traefik.http.routers.${INSTANCE_NAME}-prometheus.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME}-prometheus.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.routers.${INSTANCE_NAME}-prometheus.middlewares=${INSTANCE_NAME}-prometheus-auth"
      - "traefik.http.middlewares.${INSTANCE_NAME}-prometheus-auth.basicauth.users=${TRAEFIK_AUTH_USERS}"
      - "traefik.http.services.${INSTANCE_NAME}-prometheus.loadbalancer.server.port=9090"
    networks: [chatsundere, traefik]

  grafana:
    image: grafana/grafana:latest
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: https://${HOST_GRAFANA}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: {condition: service_started}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${INSTANCE_NAME}-grafana.rule=Host(`${HOST_GRAFANA}`)"
      - "traefik.http.routers.${INSTANCE_NAME}-grafana.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME}-grafana.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.${INSTANCE_NAME}-grafana.loadbalancer.server.port=3000"
    networks: [chatsundere, traefik]
  # <<< MONITORING

  # >>> WATCHTOWER
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_SCOPE: ${INSTANCE_NAME}
      WATCHTOWER_LABEL_ENABLE: 'true'
      WATCHTOWER_CLEANUP: 'true'
      WATCHTOWER_POLL_INTERVAL: '300'
    labels:
      - "com.centurylinklabs.watchtower.scope=${INSTANCE_NAME}"
    networks: [chatsundere]
  # <<< WATCHTOWER

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  # Key stays `chatsundere`; the real network name auto-namespaces to
  # `${INSTANCE_NAME}_chatsundere` via the top-level `name:` project prefix.
  chatsundere:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}

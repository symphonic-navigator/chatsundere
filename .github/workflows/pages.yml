name: GitHub Pages Deploy

# Two artefacts on one site: the teaser (docs/) follows master, so its texts go
# live with every push; the alpha PWA (/alpha/) is always built from the highest
# stable release tag, so alpha users only ever get a release, never master's
# next-release work. See obsidian/RELEASE-PROCESS.md.
on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Find the highest stable release
        id: release
        run: |
          TAG=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}" 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [[ -z "$TAG" ]]; then echo "No stable release tag found" >&2; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "The alpha PWA is built from $TAG"

      # The release's own tree, with its own .mise.toml and lockfile.
      - name: Checkout the release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      # The teaser site as it is on master.
      - name: Checkout master's teaser site
        uses: actions/checkout@v4
        with:
          ref: master
          path: _teaser
          sparse-checkout: docs

      - name: Set up mise (bun, node, pnpm)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Compute version
        id: version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=$VERSION"     >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "built_at=$BUILT_AT"   >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION (sha=$SHORT_SHA built_at=$BUILT_AT)"

      - name: Build PWA with /alpha/ base
        env:
          VITE_BASE: /alpha/
          APP_VERSION:  ${{ steps.version.outputs.version }}
          APP_SHA:      ${{ steps.version.outputs.short_sha }}
          APP_BUILT_AT: ${{ steps.version.outputs.built_at }}
        run: pnpm --filter user-client build

      - name: Stage Pages output
        run: |
          mkdir -p _pages
          cp -r _teaser/docs/* _pages/
          cp -r apps/user-client/dist _pages/alpha

      - name: Write build manifest
        env:
          VERSION:   ${{ steps.version.outputs.version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          BUILT_AT:  ${{ steps.version.outputs.built_at }}
          TAG:       ${{ steps.release.outputs.tag }}
        run: |
          cat > _pages/alpha/build-manifest.json << EOF
          {
            "schema": "chatsundere-build/v1",
            "built_at": "$BUILT_AT",
            "trigger": "${GITHUB_EVENT_NAME}",
            "ref": "refs/tags/$TAG",
            "artifact": {
              "name": "user-client",
              "type": "pwa",
              "version": "$VERSION",
              "git_sha": "$SHORT_SHA"
            }
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
